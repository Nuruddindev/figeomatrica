[workspace]
resolver = "2"
members = ["crates/core", "crates/pipeline", "crates/rhetorica"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kushala"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figeometrica-core = { path = "crates/core" }
